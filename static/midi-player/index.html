<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Grid Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Main Content Area -->
        <div class="main-content">
            <div class="grid-controller-container">
                <div class="grid-controller" id="grid-controller">
                    <!-- Grid buttons will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Settings Sidebar -->
        <div class="sidebar" id="settings-sidebar">
            <div class="sidebar-content">
                <div id="midi-status" class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Checking MIDI support...</span>
                </div>
                <!-- Compact Settings Row -->
                <div class="compact-settings">
                    <div class="compact-control">
                        <label for="root-key">Key:</label>
                        <select id="root-key">
                            <option value="0">C</option>
                            <option value="1">C#/Db</option>
                            <option value="2">D</option>
                            <option value="3">D#/Eb</option>
                            <option value="4">E</option>
                            <option value="5">F</option>
                            <option value="6">F#/Gb</option>
                            <option value="7">G</option>
                            <option value="8">G#/Ab</option>
                            <option value="9">A</option>
                            <option value="10">A#/Bb</option>
                            <option value="11">B</option>
                        </select>
                    </div>

                    <div class="compact-control">
                        <label for="scale-type">Scale:</label>
                        <select id="scale-type">
                            <option value="major">Major</option>
                            <option value="minor">Minor</option>
                            <option value="dorian">Dorian</option>
                            <option value="phrygian">Phrygian</option>
                            <option value="lydian">Lydian</option>
                            <option value="mixolydian">Mixolydian</option>
                            <option value="locrian">Locrian</option>
                            <option value="harmonic-minor">Harmonic Minor</option>
                            <option value="melodic-minor">Melodic Minor</option>
                            <option value="pentatonic-major">Pentatonic Major</option>
                            <option value="pentatonic-minor">Pentatonic Minor</option>
                        </select>
                    </div>

                    <div class="compact-control">
                        <label for="base-octave">Octave:</label>
                        <select id="base-octave">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select>
                    </div>

                    <div class="compact-control">
                        <label for="channel">Channel:</label>
                        <select id="channel">
                            <option value="0">1</option>
                            <option value="1">2</option>
                            <option value="2">3</option>
                            <option value="3">4</option>
                            <option value="4">5</option>
                            <option value="5">6</option>
                            <option value="6">7</option>
                            <option value="7">8</option>
                            <option value="8">9</option>
                            <option value="9">10</option>
                            <option value="10">11</option>
                            <option value="11">12</option>
                            <option value="12">13</option>
                            <option value="13">14</option>
                            <option value="14">15</option>
                            <option value="15">16</option>
                        </select>
                    </div>

                    <div class="compact-control">
                        <label for="velocity">Velocity:</label>
                        <input type="number" id="velocity" min="0" max="127" value="64">
                    </div>
                </div>

                <div class="midi-devices">
                    <h3>MIDI Output Devices</h3>
                    <div id="midi-devices-container">
                        <p>No devices available</p>
                    </div>
                </div>

                <div class="midi-devices">
                    <h3>MIDI Input Devices</h3>
                    <div id="midi-input-devices-container">
                        <p>No devices available</p>
                    </div>
                </div>

                <div class="manual-controls">
                    <h3>Manual MIDI Controls</h3>
                    <div class="button-group">
                        <button id="all-notes-off">All Notes Off</button>
                    </div>
                </div>

                <div class="midi-log">
                    <h3>MIDI Log</h3>
                    <div id="midi-log-content"></div>
                    <button id="clear-log">Clear Log</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
